backend:
  name: github
  repo: VOTRE-COMPTE-GITHUB/VOTRE-DEPOT   # <-- A REMPLACER par ex. anton/il-ritrovo
  branch: main

media_folder: "images/dishes"
public_folder: "/images/dishes"
locale: "fr"

collections:
  - name: "site"
    label: "Contenu du site"
    files:
      - name: "accueil"
        label: "Accueil"
        file: "content/accueil.json"
        fields:
          - { label: "Accroche (sous le logo)", name: "accroche", widget: "text" }

      - name: "cartes"
        label: "Nos cartes (plats & photos)"
        file: "content/cartes.json"
        fields:
          - label: "Les Planches"
            name: "planches"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Badge (optionnel)", name: "tag", widget: "string", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }
          - label: "Le Déjeuner"
            name: "dejeuner"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Badge (optionnel)", name: "tag", widget: "string", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }
          - label: "Les Cocktails"
            name: "cocktails"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Badge (optionnel)", name: "tag", widget: "string", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }
          - label: "Les desserts"
            name: "desserts"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
              - { label: "Badge (optionnel)", name: "tag", widget: "string", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }

      - name: "histoire"
        label: "Notre histoire"
        file: "content/histoire.json"
        fields:
          - { label: "Petit titre (eyebrow)", name: "eyebrow", widget: "string" }
          - { label: "Titre", name: "titre", widget: "string" }
          - { label: "Paragraphe 1", name: "p1", widget: "text" }
          - { label: "Paragraphe 2", name: "p2", widget: "text" }

      - name: "generosite"
        label: "Sel & soleil"
        file: "content/generosite.json"
        fields:
          - { label: "Petit titre (eyebrow)", name: "eyebrow", widget: "string" }
          - { label: "Titre", name: "titre", widget: "string" }
          - { label: "Paragraphe 1", name: "p1", widget: "text" }
          - { label: "Paragraphe 2", name: "p2", widget: "text" }

      - name: "infos"
        label: "Infos pratiques"
        file: "content/infos.json"
        fields:
          - { label: "Adresse (ligne 1)", name: "adresse_l1", widget: "string" }
          - { label: "Adresse (ligne 2)", name: "adresse_l2", widget: "string" }
          - { label: "Téléphone", name: "telephone", widget: "string" }
          - { label: "Services", name: "services", widget: "string" }
